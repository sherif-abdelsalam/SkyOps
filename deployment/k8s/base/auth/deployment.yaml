apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherapp-auth
  namespace: skyops-apps-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weatherapp-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weatherapp-auth
    spec:
      containers:
      - name: weatherapp-auth
        image: "187899929694.dkr.ecr.eu-north-1.amazonaws.com/skyops-auth:latest"
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
        env:
          - name: DB_HOST
            value: mysql

          - name: DB_USER
            value: authuser

          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: skyops-db-auth
                key: auth-password
          - name: DB_NAME
            value: weatherapp

          - name: DB_PORT
            value: "3306"
            
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: skyops-db-auth
                key: secret-key