---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weatherapp-weather
  namespace: skyops-apps-dev

spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: weatherapp-weather
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weatherapp-weather
    spec:
      containers:
        - name: weatherapp-weather
          image: "187899929694.dkr.ecr.eu-north-1.amazonaws.com/skyops-weather:latest"
          imagePullPolicy: IfNotPresent
          env:
          - name: APIKEY
            valueFrom:
              secretKeyRef:
                name: skyops-weather-auth
                key: apikey
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http