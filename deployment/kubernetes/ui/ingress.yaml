apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weatherapp-ui-ingress
  namespace: default        # change to your app's namespace
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx   # uses the default NGINX controller we installed
  rules:
  - http:                   # no host — works with any hostname or IP
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: weatherapp-ui   # your service name
            port:
              number: 3000