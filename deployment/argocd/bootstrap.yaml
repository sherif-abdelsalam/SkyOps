---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skyops-bootstrap-app
  namespace: argocd
  # annotations:
  #   argocd-image-updater.argoproj.io/image-list: sherifabdelsalam111/nginx-sherif:~v0.1
  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:sherif-abdelsalam/SkyOps.git
    targetRevision: main
    path: deploymentls/argocd
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
