services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - ./apps/mysql-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build: ./apps/auth
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: authuser
      DB_PASSWORD: my-secret-pw
      DB_NAME: weatherapp
      SECRET_KEY: local_dev_secret
      AUTH_PORT: "8080"
    depends_on:
      mysql:
        condition: service_healthy

  weather:
    build: ./apps/weather
    ports:
      - "5000:5000"
    environment:
      APIKEY: ${RAPIDAPI_KEY:-replace_me}

  ui:
    build: ./apps/UI
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      AUTH_HOST: auth
      AUTH_PORT: "8080"
      WEATHER_HOST: weather
      WEATHER_PORT: "5000"
      SECRET_KEY: local_dev_secret
    depends_on:
      - auth
      - weather
